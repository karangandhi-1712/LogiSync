# ─────────────────────────────────────────────────────────────────────────────
# LogiSync v2.0 — Production Nginx Configuration (Reverse Proxy & SPA Host)
# Place at /etc/nginx/sites-available/logisync and symlink to sites-enabled
# ─────────────────────────────────────────────────────────────────────────────

upstream fastapi_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name logisync.vocport.gov.in _; # Replace with your custom domain or EC2 Elastic IP

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Main HTTPS Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name logisync.vocport.gov.in _;

    # SSL / TLS Hardening
    ssl_certificate /etc/letsencrypt/live/logisync.vocport.gov.in/fullchain.pem; # Managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/logisync.vocport.gov.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Static Frontend SPA Bundle
    root /opt/logisync/frontend/dist;
    index index.html;

    # Frontend SPA Routes Fallback
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Static Assets Cache (Immutable Vite hashes)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # FastAPI REST Endpoints Reverse Proxy
    location /api/ {
        proxy_pass http://fastapi_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90;
    }

    # Live Telemetry WebSocket Reverse Proxy
    location /ws/ {
        proxy_pass http://fastapi_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400; # 24 hour persistent telematics stream
    }

    # API Documentation & Health Check
    location /docs {
        proxy_pass http://fastapi_backend/docs;
    }
    location /openapi.json {
        proxy_pass http://fastapi_backend/openapi.json;
    }
    location /healthz {
        proxy_pass http://fastapi_backend/healthz;
        access_log off;
    }
}
