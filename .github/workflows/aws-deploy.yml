name: AWS Production CI/CD Pipeline - LogiSync v2.0

on:
  push:
    branches: [ "main" ]

permissions:
  id-token: write   # OIDC authentication with AWS (Secure - no static credentials)
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: logisync-backend
  ECS_CLUSTER: logisync-cluster
  ECS_SERVICE: logisync-backend-service
  S3_FRONTEND_BUCKET: logisync-frontend
  CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}

jobs:
  # ─── Stage 1: Continuous Integration (Lint, Typecheck, Test) ─────────────────
  test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run Backend Pytest Suite
        run: |
          cd backend
          pytest -v

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend Production Artifact
        run: |
          cd frontend
          npm install --legacy-peer-deps
          npm run build

  # ─── Stage 2: Build & Push Docker Container to Amazon ECR ────────────────────
  deploy-backend:
    name: Deploy Backend to Amazon ECS Fargate
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG ./backend
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Trigger Rolling Deployment in ECS Fargate
        run: |
          aws ecs update-service --cluster $ECS_CLUSTER --service $ECS_SERVICE --force-new-deployment

  # ─── Stage 3: Static Asset Sync to S3 & CloudFront Cache Invalidation ────────
  deploy-frontend:
    name: Deploy Frontend to S3 & CloudFront
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Compile Frontend Bundle
        run: |
          cd frontend
          npm install --legacy-peer-deps
          npm run build

      - name: Sync Static Assets to Amazon S3
        run: |
          aws s3 sync frontend/dist/ s3://$S3_FRONTEND_BUCKET/ --delete --cache-control "public, max-age=31536000, immutable" --exclude "index.html"
          aws s3 cp frontend/dist/index.html s3://$S3_FRONTEND_BUCKET/index.html --cache-control "no-cache, no-store, must-revalidate"

      - name: Invalidate Amazon CloudFront Edge Cache
        run: |
          aws cloudfront create-invalidation --distribution-id $CLOUDFRONT_DISTRIBUTION_ID --paths "/*"
